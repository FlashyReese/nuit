name: Publish

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build:
    if: github.repository_owner == 'FlashyReese'
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: 21
          check-latest: true
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-disabled: true
          cache-provider: basic
      - name: Build and publish with Gradle
        run: ./gradlew build publishAllPublicationsToFlashyReeseReleasesRepository -Pbuild.release
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-jars
          path: |
            fabric/build/libs/
            neoforge/build/libs/
          if-no-files-found: error
          retention-days: 1
  publish:
    if: github.repository_owner == 'FlashyReese'
    needs: build
    runs-on: self-hosted
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - platform: fabric
            name: Fabric
          - platform: neoforge
            name: NeoForge
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-jars
      - name: Publish ${{ matrix.name }} to Modrinth, CurseForge & GitHub
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3.1
        with:
          modrinth-id: YBz7DOs8
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          curseforge-id: 408209
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          github-token: ${{ secrets.GITHUB_TOKEN }}

          name: '[${{ matrix.name }}] ${{ github.event.release.name }}'
          version: '${{ github.event.release.tag_name }}+${{ matrix.platform }}'

          game-versions: '26.2'
          loaders: ${{ matrix.platform }}
          environment: client

          files: |
            ${{ matrix.platform }}/build/libs/!(*-@(dev|sources|javadoc|dev-shadow)).jar
            ${{ matrix.platform }}/build/libs/*-@(dev|sources|javadoc|dev-shadow).jar
