name: Self-Hosted runner CI with Gradle

on: [push]

jobs:
  selfhost-build:
    if: github.repository_owner == 'FlashyReese'
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: 25
          check-latest: true
      - name: Build and Publish with Gradle
        run: ./gradlew build publishAllPublicationsToFlashyReeseSnapshotsRepository
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
      - name: Upload Build Artifacts - Fabric
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: 'Nuit Fabric Artifacts'
          path: fabric/build/libs
      - name: Upload Build Artifacts - NeoForge
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: 'Nuit NeoForge Artifacts'
          path: neoforge/build/libs
