architectury {
    common rootProject.enabled_platforms.split(',')
}

loom {
    accessWidenerPath = file("src/main/resources/nuit.accesswidener")
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    compileOnly "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.13.4'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.13.4'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.13.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

// Versioned dev JARs from another checked-out branch can remain in this shared build directory. Architectury's
// runtime transformer may then load the obsolete JAR and apply the wrong Minecraft-version mixins.
def currentDevJarName = tasks.named('jar', Jar).flatMap { it.archiveFileName }
def commonArchivePrefix = base.archivesName.get()
def staleDevJars = layout.buildDirectory.dir('devlibs').map { directory ->
    directory.asFileTree.matching {
        include "${commonArchivePrefix}-*-dev.jar"
        exclude currentDevJarName.get()
    }
}
def cleanStaleDevJars = tasks.register('cleanStaleDevJars', Delete) {
    delete staleDevJars
}

tasks.named('jar') {
    dependsOn cleanStaleDevJars
}
